<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(active, user)"
       class="sidebar-shell">
    <a th:href="@{/}" class="sidebar-brand">
        <img id="app-logo" src="/images/Vlearn.png" alt="V-Learn" class="app-logo-sidebar"/>
        <span class="font-semibold text-vtext text-base tracking-wide">V-Learn</span>
    </a>

    <nav class="sidebar-nav flex-1 text-sm">
        <!-- Student menu -->
        <th:block th:if="${user != null and user.role.name() == 'STUDENT'}">
            <a th:href="@{/student}"
               class="sidebar-link"
               th:classappend="${active} == 'student-videos' ? ' sidebar-link--active' : ''">
                Videos
            </a>
            <a th:href="@{/student/ai}"
               class="sidebar-link"
               th:classappend="${active} == 'student-ai' ? ' sidebar-link--active' : ''">
                ✨ AI Assistant
            </a>
            <a th:href="@{/student/profile}"
               class="sidebar-link"
               th:classappend="${active} == 'student-profile' ? ' sidebar-link--active' : ''">
                Profile &amp; Results
            </a>
        </th:block>

        <!-- Teacher menu -->
        <th:block th:if="${user != null and user.role.name() == 'TEACHER'}">
            <a th:href="@{/teacher}"
               class="sidebar-link"
               th:classappend="${active} == 'teacher-videos' ? ' sidebar-link--active' : ''">
                Manage Videos
            </a>
            <a th:href="@{/teacher/video/upload}"
               class="sidebar-link"
               th:classappend="${active} == 'teacher-upload' ? ' sidebar-link--active' : ''">
                Upload Video
            </a>
            <a th:href="@{/teacher/results}"
               class="sidebar-link"
               th:classappend="${active} == 'teacher-results' ? ' sidebar-link--active' : ''">
                Student Results
            </a>
        </th:block>

        <!-- Admin menu -->
        <th:block th:if="${user != null and user.role.name() == 'ADMIN'}">
            <a th:href="@{/admin}"
               class="sidebar-link"
               th:classappend="${active} == 'admin-dashboard' ? ' sidebar-link--active' : ''">
                Main Dashboard
            </a>
            <a th:href="@{/teacher}"
               class="sidebar-link"
               th:classappend="${active} == 'admin-videos' ? ' sidebar-link--active' : ''">
                Video Manager
            </a>
            <a th:href="@{/admin/results}"
               class="sidebar-link"
               th:classappend="${active} == 'admin-results' ? ' sidebar-link--active' : ''">
                Student Results
            </a>
        </th:block>
    </nav>

    <div class="mt-auto pt-4 border-t border-slate-700/50 flex flex-col gap-1">
        <button type="button"
                id="btn-open-password-modal"
                onclick="document.getElementById('change-password-modal').classList.remove('hidden')"
                class="w-full text-left px-3 py-2 text-xs font-medium text-slate-400 hover:text-white hover:bg-slate-700/40 rounded-lg transition flex items-center gap-2">
            <svg class="w-4 h-4 text-vaccent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
            </svg>
            Change Password
        </button>
        <a th:href="@{/logout}" class="sidebar-logout text-sm">
            Logout
        </a>
    </div>

    <!-- Change Password Modal -->
    <div id="change-password-modal" class="hidden fixed inset-0 z-[120] flex items-center justify-center p-4" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="document.getElementById('change-password-modal').classList.add('hidden')"></div>
        <div class="relative w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 z-10 text-slate-100">
            <div class="flex items-center justify-between pb-3 border-b border-slate-700 mb-4">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    🔑 Change Password
                </h3>
                <button type="button" onclick="document.getElementById('change-password-modal').classList.add('hidden')" class="text-slate-400 hover:text-white text-xl leading-none">&times;</button>
            </div>
            <form th:action="@{/change-password}" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Current Password</label>
                    <input type="password" name="currentPassword" required placeholder="Enter current password"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-vaccent focus:ring-1 focus:ring-vaccent transition"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">New Password</label>
                    <input type="password" name="newPassword" minlength="6" required placeholder="At least 6 characters"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-vaccent focus:ring-1 focus:ring-vaccent transition"/>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Confirm New Password</label>
                    <input type="password" name="confirmPassword" minlength="6" required placeholder="Re-enter new password"
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-vaccent focus:ring-1 focus:ring-vaccent transition"/>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="document.getElementById('change-password-modal').classList.add('hidden')"
                            class="px-4 py-2 rounded-lg text-sm font-medium bg-slate-700 hover:bg-slate-600 text-slate-200 transition">
                        Cancel
                    </button>
                    <button type="submit"
                            class="px-5 py-2 rounded-lg text-sm font-medium bg-vaccent hover:opacity-90 text-white shadow-md transition">
                        Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</aside>
</body>
</html>
