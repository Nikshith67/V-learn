<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/head :: head('Test Result')}"></th:block>
</head>
<body class="min-h-screen bg-vdark text-vtext antialiased">
    <nav th:replace="~{fragments/nav :: navbar(${user})}"></nav>
    <main class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="bg-vcard border border-slate-600/50 rounded-xl p-8 shadow-xl text-center">
            <img id="app-logo" src="/images/Vlearn.png" alt="V-Learn" class="app-logo--large mx-auto mb-2"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"/>
            <span class="text-2xl font-bold text-vtext hidden" style="display:none;">V-Learn</span>
            <p class="text-vmuted text-sm mb-8">Empowering your learning journey</p>

            <h2 class="text-xl font-semibold mb-1" th:text="${studentName}">Student Name</h2>
            <p class="text-vmuted text-sm mb-6" th:text="${videoTitle}">Video Title</p>

            <div class="grid grid-cols-3 gap-4 mb-8">
                <div class="bg-vdark rounded-lg p-4">
                    <p class="text-vmuted text-xs uppercase">Total Questions</p>
                    <p class="text-2xl font-bold" th:text="${result.totalQuestions}">0</p>
                </div>
                <div class="bg-vdark rounded-lg p-4">
                    <p class="text-emerald-400/80 text-xs uppercase">Correct</p>
                    <p class="text-2xl font-bold text-emerald-400" th:text="${result.correctAnswers}">0</p>
                </div>
                <div class="bg-vdark rounded-lg p-4">
                    <p class="text-red-400/80 text-xs uppercase">Wrong</p>
                    <p class="text-2xl font-bold text-red-400" th:text="${result.wrongAnswers}">0</p>
                </div>
            </div>

            <p class="text-3xl font-bold text-vaccent mb-2"><span th:text="${#numbers.formatDecimal(result.totalQuestions > 0 ? result.correctAnswers * 100.0 / result.totalQuestions : 0, 1, 1)}">0</span>%</p>
            <p id="motivationText" class="text-lg text-vmuted" th:text="${motivation}">Keep practicing!</p>

            <a th:href="@{/student}" class="inline-block mt-8 bg-vaccent text-white px-6 py-2.5 rounded-lg font-medium hover:opacity-90">Back to Videos</a>
            <a th:href="@{/student/profile}" class="inline-block mt-4 ml-2 text-vmuted hover:text-vtext">My Profile</a>
        </div>
    </main>
</body>
</html>
