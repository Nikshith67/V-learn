<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/head :: head('Teacher Dashboard')}"></th:block>
</head>
<body class="min-h-screen bg-vdark text-vtext antialiased">
    <div class="layout-sidebar-main">
        <div th:replace="~{fragments/sidebar :: sidebar('teacher-videos', ${user})}"></div>
        <main class="layout-sidebar-main__content flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
            <h1 class="text-2xl font-bold">My Videos</h1>
            <div class="flex items-center gap-3">
                <button type="button" onclick="document.getElementById('change-password-modal').classList.remove('hidden')"
                        class="px-3.5 py-2 rounded-lg text-sm font-medium bg-slate-700/80 hover:bg-slate-700 text-slate-200 border border-slate-600/60 shadow-sm transition flex items-center gap-2">
                    <span>🔑</span> Change Password
                </button>
                <a th:href="@{/teacher/video/upload}" class="bg-vaccent text-white px-4 py-2 rounded-lg font-medium hover:opacity-90">Upload Video</a>
            </div>
        </div>
        <p th:if="${message}" class="text-emerald-400 mb-4" th:text="${message}"></p>
        <p th:if="${error}" class="text-red-400 mb-4" th:text="${error}"></p>

        <th:block th:if="${#lists.isEmpty(videos)}">
            <div class="bg-vcard border border-slate-600/50 rounded-xl p-8 text-center text-vmuted">
                <p>You haven't uploaded any videos yet.</p>
                <a th:href="@{/teacher/video/upload}" class="text-vaccent hover:underline mt-2 inline-block">Upload your first video</a>
            </div>
        </th:block>
        <div th:if="${!#lists.isEmpty(videos)}" class="grid gap-4">
            <div th:each="v : ${videos}" class="bg-vcard border border-slate-600/50 rounded-xl p-4 flex justify-between items-center">
                <div>
                    <h3 class="font-semibold" th:text="${v.title}">Title</h3>
                    <p class="text-vmuted text-sm" th:text="${v.subject}">Subject</p>
                </div>
                <div class="flex gap-2 items-center flex-wrap justify-end">
                    <a th:href="@{/teacher/video/{id}/edit(id=${v.id})}"
                       class="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1.5 rounded text-sm">
                        Edit details
                    </a>
                    <a th:href="@{/teacher/video/{id}/questions(id=${v.id})}"
                       class="bg-slate-600 hover:bg-slate-500 text-white px-3 py-1.5 rounded text-sm">
                        Manage Questions
                    </a>
                    <form th:action="@{/teacher/video/{id}/delete(id=${v.id})}" method="post"
                          onsubmit="return confirm('Delete this video? This will also remove its questions and related student progress/results.');">
                        <button type="submit" class="px-3 py-1.5 rounded text-sm font-medium text-white"
                                style="background: linear-gradient(135deg, #e11d48, #fb7185);">
                            Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
    </div>
</body>
</html>
