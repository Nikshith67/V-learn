<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <th:block th:replace="~{fragments/head :: head('Add Question')}"></th:block>
</head>
<body class="min-h-screen bg-vdark text-vtext antialiased">
    <div class="layout-sidebar-main">
        <div th:replace="~{fragments/sidebar :: sidebar('teacher-videos', ${user})}"></div>
        <main class="layout-sidebar-main__content flex-1 max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-2xl font-bold mb-2">Add MCQ Question</h1>
        <p class="text-vmuted mb-6" th:text="${video.title}">Video</p>
        <form th:action="@{/teacher/video/{id}/questions/add(id=${video.id})}" method="post" class="space-y-4 bg-vcard border border-slate-600/50 rounded-xl p-6">
            <div>
                <label for="questionText" class="block text-sm font-medium text-vmuted mb-1">Question text *</label>
                <textarea id="questionText" name="questionText" required rows="3"
                          class="w-full px-4 py-2 rounded-lg form-input-light focus:ring-2 focus:ring-vaccent"></textarea>
            </div>
            <div>
                <label for="option1" class="block text-sm font-medium text-vmuted mb-1">Option 1 *</label>
                <input type="text" id="option1" name="option1" required
                       class="w-full px-4 py-2 rounded-lg form-input-light focus:ring-2 focus:ring-vaccent"/>
            </div>
            <div>
                <label for="option2" class="block text-sm font-medium text-vmuted mb-1">Option 2 *</label>
                <input type="text" id="option2" name="option2" required
                       class="w-full px-4 py-2 rounded-lg form-input-light focus:ring-2 focus:ring-vaccent"/>
            </div>
            <div>
                <label for="option3" class="block text-sm font-medium text-vmuted mb-1">Option 3 *</label>
                <input type="text" id="option3" name="option3" required
                       class="w-full px-4 py-2 rounded-lg form-input-light focus:ring-2 focus:ring-vaccent"/>
            </div>
            <div>
                <label for="option4" class="block text-sm font-medium text-vmuted mb-1">Option 4 *</label>
                <input type="text" id="option4" name="option4" required
                       class="w-full px-4 py-2 rounded-lg form-input-light focus:ring-2 focus:ring-vaccent"/>
            </div>
            <div>
                <label for="correctOption" class="block text-sm font-medium text-vmuted mb-1">Correct option (1–4) *</label>
                <select id="correctOption" name="correctOption" required class="w-full px-4 py-2 rounded-lg form-input-light focus:ring-2 focus:ring-vaccent">
                    <option value="1">Option 1</option>
                    <option value="2">Option 2</option>
                    <option value="3">Option 3</option>
                    <option value="4">Option 4</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-vaccent text-white py-2.5 rounded-lg font-medium hover:opacity-90">Add Question</button>
        </form>
        <a th:href="@{/teacher/video/{id}/questions(id=${video.id})}" class="inline-block mt-4 text-vmuted hover:text-vtext">← Back to questions</a>
    </main>
    </div>
</body>
</html>
