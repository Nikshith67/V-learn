# Application
spring.application.name=V-Learn

# H2 Database (development)
spring.datasource.url=jdbc:h2:file:./data/vlearn;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=mysqp
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload (videos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Video storage path (absolute or relative to app)
vlearn.videos.upload-dir=${user.dir}/vlearn-uploads/videos
vlearn.videos.url-path=/videos/** 

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Optional: Switch to MySQL for production (uncomment and set)
# spring.datasource.url=jdbc:mysql://localhost:3306/vlearn?useSSL=false&serverTimezone=UTC
