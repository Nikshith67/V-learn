# Application
spring.application.name=V-Learn
server.port=${PORT:8080}
vlearn.admin.password=${ADMIN_PASSWORD:admin123}

# H2 Database (development)
spring.datasource.url=jdbc:h2:file:./data/vlearn;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=mysqp
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File upload (videos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Video storage path (absolute or relative to app)
vlearn.videos.upload-dir=${user.dir}/vlearn-uploads/videos
vlearn.videos.url-path=/videos/** 

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Optional: Switch to MySQL for production (uncomment and set)
# spring.datasource.url=jdbc:mysql://localhost:3306/vlearn?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Import optional local configuration (e.g. application-local.properties, ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# AI Study Assistant (Google Gemini / OpenAI / Groq / NVIDIA NIM)
# For local dev: Key is loaded automatically from application-local.properties
# For cloud hosting: Set AI_API_KEY environment variable in your host dashboard
vlearn.ai.endpoint=${AI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}
vlearn.ai.model=${AI_MODEL:gemini-3.5-flash}
vlearn.ai.fallback-model=${AI_FALLBACK_MODEL:gemini-3.5-flash-lite}
vlearn.ai.max-tokens=${AI_MAX_TOKENS:4096}
vlearn.ai.api-key=${AI_API_KEY:}

